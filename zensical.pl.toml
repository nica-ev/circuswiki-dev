[project]
site_name = "CircusWiki"
site_url = "https://nica-ev.github.io/circuswiki/pl/"
site_author = "Marc Bielert"
site_description = "A wiki dedicated to circus pedagogy, circus arts, education, movement games, and related topics."
copyright = "CC BY-SA 4.0"
docs_dir = ".build/pl"
site_dir = "site/pl"
extra_javascript = ["javascripts/language-switcher.js", "javascripts/translation-status.js"]

nav = [
  { "Home" = "index.md" },
  { "NICA e.V." = "Dokumentation Nica eV.md" },
  { "Gry Ruchowe" = "Bewegungs-Spiele.md" },
  { "Lista Wszystkich Gier" = "Liste aller Spiele.md" },
  { "Projekt Erasmus+" = "Lets-talk-about-inclusive-circus-practice.md" },
  { "Dołącz" = "mitmachen.md" },
]

[project.extra]
alternate = [
  { name = "Deutsch", link = "/circuswiki/", lang = "de" },
  { name = "English", link = "/circuswiki/en/", lang = "en" },
  { name = "Polski", link = "/circuswiki/pl/", lang = "pl" },
]

[project.theme]
variant = "modern"
language = "pl"
features = [
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.suggest",
  "search.highlight",
]

[project.markdown_extensions.nl2br]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.blocks.caption]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
